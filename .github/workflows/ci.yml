name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../evals && ruff format --check . ../evals
      - name: Typecheck
        run: mypy app
      - name: Test
        run: pytest
      - name: Validate knowledge base
        run: python -m scripts.ingest_knowledge --dry-run
      - name: Evals plumbing check (offline, fake providers)
        run: python ../evals/run_evals.py --mode fake
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r supabase/tests/requirements.txt
      - name: Migrations smoke test (embedded Postgres + pgvector)
        run: python supabase/tests/test_migrations.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
