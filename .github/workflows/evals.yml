name: Evals

# Manual trigger only. "fake" checks the eval pipeline offline (no secrets, no API calls).
# "live" calls Groq, Gemini and Supabase (free tiers) and reuses the committed response cache in
# evals/.cache/, so only changed prompts, data or models cost calls. Results are uploaded as an
# artifact; commit them yourself if you want the Engineering page to show them.
# Secrets used by name only: GROQ_API_KEY, GEMINI_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# and optionally LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST for tracing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fake (offline) or live (real providers, cached)"
        type: choice
        options: [fake, live]
        default: fake
      cache_only:
        description: "live only: re-render from the cache without any API calls"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run evals
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_FAST_MODEL: openai/gpt-oss-20b
          GROQ_STRONG_MODEL: openai/gpt-oss-120b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.5-flash
          GEMINI_EMBEDDING_MODEL: gemini-embedding-001
          EMBEDDING_DIM: "768"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
        run: |
          if [ "${{ inputs.mode }}" = "live" ]; then
            python evals/run_evals.py --mode live ${{ inputs.cache_only && '--cache-only' || '' }}
          else
            python evals/run_evals.py --mode fake
          fi
      - name: Job summary
        run: |
          f=evals/results.md; [ "${{ inputs.mode }}" = "fake" ] && f=evals/out-fake/results.md
          cat "$f" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ inputs.mode }}
          path: |
            evals/results.md
            evals/results.json
            evals/out-fake/
            frontend/lib/eval-results.json
          if-no-files-found: warn
