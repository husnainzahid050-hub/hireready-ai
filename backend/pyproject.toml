[project]
name = "hireready-backend"
version = "0.1.0"
description = "HireReady AI backend (FastAPI)"
requires-python = ">=3.12,<3.13"
# Vercel installs from THIS list when pyproject.toml exists (requirements.txt is ignored).
# Keep it identical to requirements.txt; tests/test_dependencies.py enforces that.
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
    "python-multipart==0.0.33",
]

# Vercel auto-detects the FastAPI `app` in app/main.py (zero-config).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]  # asserts and long fixture lines are fine in tests
# Long natural-language prose (prompts, demo documents): wrapping would change the text.
"app/services/prompts.py" = ["E501"]
"app/demo/samples.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
