# Keyword aliases for the ATS readiness check (backend/app/services/ats.py).
#
# Each entry is one concept: the canonical name, then other spellings and abbreviations a CV or
# JD may use. Plain ATS keyword search often treats these as DIFFERENT words, so a match found
# only through an alias scores half (alias_only) and the fix is "write both forms".
# Plurals, -ing/-ed, hyphen/space and dotted forms (node.js = nodejs) are handled in code and
# need no entry here. Keep entries lowercase. Not ingested into the knowledge base (only *.md is).

